<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PMP · Website value, all practices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-gate="{{HASH}}" data-links='{{LINKS}}'>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <img class="pmp-logo" src="assets/pmp-logo.png" alt="Practice Made Purrfect">
      </div>
      <div class="client"><span class="pill">Internal</span></div>
    </header>
    <div class="masthead">
      <h1>Website value: all practices</h1>
      <p>Every practice we track, the value their websites generate, and whether the tracking is still telling the truth. Internal, not for clients.</p>
    </div>
    <div class="filters">
      <div class="seg" id="period" role="group" aria-label="Period">
        <button data-p="6m" aria-pressed="false">Last 6 months</button>
        <button data-p="12m" aria-pressed="true">Last 12 months</button>
        <button data-p="ytd" aria-pressed="false">This year</button>
        <button data-p="all" aria-pressed="false">Since tracking began</button>
      </div>
      <span class="right" id="updated"></span>
    </div>
    <main id="app"><div class="empty">Loading…</div></main>
  </div>
  <script src="assets/app.js"></script>
  <script src="assets/overview.js"></script>
</body>
</html>
